<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SuperBancas ⭐ Jogos Online</title>


<style>
:root{
  --primary:#00c4ff;
  --bg:#070b14;
  --text:#eaeaea;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  min-height:100vh;
}

header{
  padding:18px;
  text-align:center;
  background:#0a111e;
}

.btn{
  display:block;
  margin:24px auto;
  padding:16px 28px;
  font-size:18px;
  font-weight:700;
  border-radius:50px;
  border:none;
  cursor:pointer;
  background:var(--primary);
  color:#000;
}

.game-wrapper{
  position:relative;
  width:100%;
  max-width:1200px;
  margin:0 auto;
  display:none;
}

iframe{
  width:100%;
  height:80vh;
  border:none;
  border-radius:16px;
}

.fullscreen-btn{
  position:absolute;
  bottom:16px;
  right:16px;
  z-index:30;
  background:rgba(0,0,0,.7);
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:30px;
  cursor:pointer;
}

.ad-overlay{
  position:absolute;
  inset:0;
  z-index:25;
  background:rgba(0,0,0,0);
  cursor:pointer;
}

.game-wrapper.fullscreen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#000;
}

.game-wrapper.fullscreen iframe{
  height:100vh;
  border-radius:0;
}
</style>
</head>

<body>

<header>
  <h1>SuperBancas – Plataforma Oficial</h1>
</header>

<button class="btn" id="playBtn">🎮 Jogar Agora</button>

<div class="game-wrapper" id="gameBox">

  <!-- INTERSTITIAL / ONCLICK (1x POR SESSÃO) -->
  <div class="ad-overlay" id="adOverlay"></div>

  <iframe
    id="gameIframe"
    src="https://app.superbancas.club/pr/Q3WZ1haO"
    allow="fullscreen; autoplay; encrypted-media"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
  </iframe>

  <button class="fullscreen-btn" id="fsBtn">⛶ Tela Cheia</button>
</div>

<script>
/* ===============================
   CONTROLE DE FREQUÊNCIA (1x)
================================ */
const adKey = "monetag_ad_shown";

/* ===============================
   ELEMENTOS
================================ */
const playBtn = document.getElementById("playBtn");
const gameBox = document.getElementById("gameBox");
const fsBtn = document.getElementById("fsBtn");
const adOverlay = document.getElementById("adOverlay");

/* ===============================
   BOTÃO JOGAR (DISPARA INTERSTITIAL)
================================ */
playBtn.addEventListener("click", () => {
  playBtn.style.display = "none";
  gameBox.style.display = "block";

  if (!sessionStorage.getItem(adKey)) {
    sessionStorage.setItem(adKey, "1");

    /* Overlay ativo por 1 clique */
    adOverlay.style.display = "block";

    setTimeout(() => {
      adOverlay.style.display = "none";
    }, 1200);
  } else {
    adOverlay.style.display = "none";
  }
}, { once:true });

/* ===============================
   FULLSCREEN REAL
================================ */
fsBtn.addEventListener("click", () => {
  gameBox.classList.add("fullscreen");

  if (gameBox.requestFullscreen) gameBox.requestFullscreen();
  else if (gameBox.webkitRequestFullscreen) gameBox.webkitRequestFullscreen();
});

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    gameBox.classList.remove("fullscreen");
  }
});

/* ===============================
   PUSH MONETAG

<!-- IFRAME OVERLAY FULLSCREEN -->
<style>
#iframeOverlayFull {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 999999;
  background: #000;
  display: none;
}

#iframeOverlayFull iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>

<div id="iframeOverlayFull">
  <iframe
    src="https://www.zepitaco.com"
    allow="fullscreen; autoplay; encrypted-media"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals allow-downloads">
  </iframe>
</div>

<script>
/* ATIVAR AUTOMATICAMENTE */
window.addEventListener("load", () => {
  document.getElementById("iframeOverlayFull").style.display = "block";
});

/* OPCIONAL: FECHAR COM VOLTAR DO CELULAR */
window.addEventListener("popstate", () => {
  document.getElementById("iframeOverlayFull").style.display = "none";
});
</script>
</body>
</html>
