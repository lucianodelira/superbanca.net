<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <!-- META BÁSICO -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SuperBancas ⭐ Plataforma Oficial de Jogos Online 2026</title>

  <!-- SEO -->
  <meta name="description" content="SuperBancas: plataforma oficial do sistema Trivo com apostas online, cassino, Fortune Tiger, Aviator, Mines e muito mais.">
  <link rel="canonical" href="https://www.superbanca.net/">

  <!-- PWA -->
  <meta name="theme-color" content="#070b14">
  <link rel="manifest" href="/manifest.json">

  <!-- MONETAG ONCLICK (APENAS UMA VEZ) -->
  <script src="https://3nbf4.com/act/files/tag.min.js?z=10577632" data-cfasync="false"></script>

  <style>
    :root {
      --primary:#00c4ff;
      --bg:#070b14;
      --text:#eaeaea;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header{
      padding:20px;
      text-align:center;
      background:#0a111e;
      position:sticky;
      top:0;
      z-index:10;
    }

    header h1{font-size:1.6rem;color:#fff}

    main{
      flex:1;
      max-width:1200px;
      margin:0 auto;
      padding:20px;
      width:100%;
    }

    .cta{
      background:var(--primary);
      color:#000;
      border:none;
      padding:16px 28px;
      font-size:18px;
      font-weight:700;
      border-radius:50px;
      cursor:pointer;
      margin:20px auto;
      display:block;
    }

    .iframe-container{
      display:none;
      margin-top:20px;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 8px 30px rgba(0,0,0,.6);
    }

    iframe{
      width:100%;
      height:80vh;
      border:none;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#04080f;
      font-size:14px;
      color:#aaa;
    }
  </style>
</head>

<body>

<header>
  <h1>SuperBancas – Plataforma Oficial de Jogos Online</h1>
</header>

<main>

  <p style="text-align:center;margin-bottom:10px">
    Clique para acessar Fortune Tiger, Aviator, Mines e apostas esportivas.
  </p>

  <!-- BOTÃO QUE DISPARA A MONETAG -->
  <button class="cta" id="startGame">
    🎮 Jogar Agora
  </button>

  <!-- IFRAME (CARREGA SÓ DEPOIS DO CLIQUE) -->
  <div class="iframe-container" id="gameBox">
    <iframe 
      src="https://www.zepitaco.com"
      allow="fullscreen; autoplay; encrypted-media"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
    </iframe>
  </div>

</main>

<footer>
  © 2026 SuperBancas — Jogo Responsável 18+
</footer>

<script>
  const btn = document.getElementById("startGame");
  const box = document.getElementById("gameBox");

  btn.addEventListener("click", () => {
    btn.style.display = "none";
    box.style.display = "block";
  }, { once: true });
</script>

</body>
</html>
