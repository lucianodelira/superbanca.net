<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>SuperBancas ⭐ Jogos Online</title>

<style>

:root{
  --primary:#00c4ff;
  --bg:#070b14;
  --text:#eaeaea;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* HEADER */
header{
  padding:22px 15px;
  text-align:center;
  background:#0a111e;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
}

header h1{
  font-size:42px;
  font-weight:800;
  color:#fff;
}

/* BOTÃO */
.btn{
  display:block;
  margin:28px auto 20px auto;
  padding:18px 34px;
  font-size:22px;
  font-weight:800;
  border-radius:60px;
  border:none;
  cursor:pointer;
  background:var(--primary);
  color:#000;
  transition:.3s;
  box-shadow:0 0 20px rgba(0,196,255,.35);
}

.btn:hover{
  transform:scale(1.05);
}

/* BANNER */
.banner-container{
  width:100%;
  display:flex;
  justify-content:center;
  padding:0 14px;
  margin-bottom:24px;
}

.banner-container img{
  width:100%;
  max-width:950px;
  border-radius:22px;
  box-shadow:0 0 30px rgba(0,196,255,.25);
}

/* GAME */
.game-wrapper{
  position:relative;
  width:100%;
  max-width:1200px;
  margin:0 auto 30px auto;
  display:none;
  padding:0 10px;
}

iframe{
  width:100%;
  height:82vh;
  border:none;
  border-radius:18px;
  background:#000;
}

/* FULLSCREEN BUTTON */
.fullscreen-btn{
  position:absolute;
  bottom:26px;
  right:26px;
  z-index:30;
  background:rgba(0,0,0,.75);
  color:#fff;
  border:none;
  padding:14px 20px;
  border-radius:40px;
  cursor:pointer;
  font-size:16px;
  font-weight:700;
  backdrop-filter:blur(4px);
}

/* FULLSCREEN MODE */
.game-wrapper.fullscreen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#000;
  max-width:100%;
  padding:0;
}

.game-wrapper.fullscreen iframe{
  height:100vh;
  border-radius:0;
}

/* OVERLAY FULLSCREEN */
#iframeOverlayFull{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:999999;
  background:#000;
  display:none;
}

#iframeOverlayFull iframe{
  width:100%;
  height:100%;
  border:none;
}

/* MOBILE */
@media(max-width:768px){

  header h1{
    font-size:26px;
  }

  .btn{
    width:90%;
    font-size:20px;
    padding:16px;
  }

  iframe{
    height:78vh;
  }

  .fullscreen-btn{
    bottom:18px;
    right:18px;
    font-size:14px;
    padding:12px 16px;
  }

}

</style>
</head>

<body>

<!-- TOPO -->
<header>
  <h1>SuperBancas – Plataforma Oficial</h1>
</header>

<!-- BOTÃO -->
<button class="btn" id="playBtn">
  🎮 Jogar Agora
</button>

<!-- BANNER -->
<div class="banner-container">
  <img
    src="https://superbancas.com.br/banner.png"
    alt="Banner SuperBancas">
</div>

<!-- GAME -->
<div class="game-wrapper" id="gameBox">

  <iframe
    id="gameIframe"
    src="https://app.superbancas.club/pr/Q3WZ1haO"
    allow="fullscreen; autoplay; encrypted-media"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
  </iframe>

  <button class="fullscreen-btn" id="fsBtn">
    ⛶ Tela Cheia
  </button>

</div>

<!-- OVERLAY FULLSCREEN -->
<div id="iframeOverlayFull">

  <iframe
    src="https://app.superbancas.club/pr/Q3WZ1haO"
    allow="fullscreen; autoplay; encrypted-media"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals allow-downloads">
  </iframe>

</div>

<script>

/* ===============================
   ELEMENTOS
================================ */

const playBtn = document.getElementById("playBtn");
const gameBox = document.getElementById("gameBox");
const fsBtn = document.getElementById("fsBtn");

/* ===============================
   BOTÃO JOGAR
================================ */

playBtn.addEventListener("click", () => {

  /* ABRE SEU LINK */
  window.open(
    "https://www.superbancas.link",
    "_blank"
  );

  /* MOSTRA O GAME */
  playBtn.style.display = "none";

  gameBox.style.display = "block";

}, { once:true });

/* ===============================
   FULLSCREEN REAL
================================ */

fsBtn.addEventListener("click", () => {

  gameBox.classList.add("fullscreen");

  if (gameBox.requestFullscreen) {

    gameBox.requestFullscreen();

  } else if (gameBox.webkitRequestFullscreen) {

    gameBox.webkitRequestFullscreen();

  }

});

/* ===============================
   SAIU DO FULLSCREEN
================================ */

document.addEventListener("fullscreenchange", () => {

  if (!document.fullscreenElement) {

    gameBox.classList.remove("fullscreen");

  }

});

/* ===============================
   OVERLAY AUTOMÁTICO
================================ */

window.addEventListener("load", () => {

  document.getElementById("iframeOverlayFull").style.display = "block";

});

/* ===============================
   FECHAR AO VOLTAR
================================ */

window.addEventListener("popstate", () => {

  document.getElementById("iframeOverlayFull").style.display = "none";

});

</script>

</body>
</html>
