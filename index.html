<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SuperBancas ⭐ Jogos Online</title>

<!-- MONETAG SITE ID (NECESSÁRIO PARA PUSH) -->
<meta name="monetag" content="c9decff8d3101c827a56f6907203431e">

<!-- MONETAG ONCLICK / INTERSTITIAL -->
<script src="https://3nbf4.com/act/files/tag.min.js?z=10577632" data-cfasync="false"></script>

<style>
:root{
  --primary:#00c4ff;
  --bg:#070b14;
  --text:#eaeaea;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  min-height:100vh;
}

header{
  padding:18px;
  text-align:center;
  background:#0a111e;
}

.btn{
  display:block;
  margin:24px auto;
  padding:16px 28px;
  font-size:18px;
  font-weight:700;
  border-radius:50px;
  border:none;
  cursor:pointer;
  background:var(--primary);
  color:#000;
}

.game-wrapper{
  position:relative;
  width:100%;
  max-width:1200px;
  margin:0 auto;
  display:none;
}

iframe{
  width:100%;
  height:80vh;
  border:none;
  border-radius:16px;
}

.fullscreen-btn{
  position:absolute;
  bottom:16px;
  right:16px;
  z-index:30;
  background:rgba(0,0,0,.7);
  color:#fff;
  border:none;
  padding:12px 18px;
  border-radius:30px;
  cursor:pointer;
}

.ad-overlay{
  position:absolute;
  inset:0;
  z-index:25;
  background:rgba(0,0,0,0);
  cursor:pointer;
}

.game-wrapper.fullscreen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#000;
}

.game-wrapper.fullscreen iframe{
  height:100vh;
  border-radius:0;
}
</style>
</head>

<body>

<header>
  <h1>SuperBancas – Plataforma Oficial</h1>
</header>

<button class="btn" id="playBtn">🎮 Jogar Agora</button>

<div class="game-wrapper" id="gameBox">

  <!-- INTERSTITIAL / ONCLICK (1x POR SESSÃO) -->
  <div class="ad-overlay" id="adOverlay"></div>

  <iframe
    id="gameIframe"
    src="https://www.zepitaco.com"
    allow="fullscreen; autoplay; encrypted-media"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
  </iframe>

  <button class="fullscreen-btn" id="fsBtn">⛶ Tela Cheia</button>
</div>

<script>
/* ===============================
   CONTROLE DE FREQUÊNCIA (1x)
================================ */
const adKey = "monetag_ad_shown";

/* ===============================
   ELEMENTOS
================================ */
const playBtn = document.getElementById("playBtn");
const gameBox = document.getElementById("gameBox");
const fsBtn = document.getElementById("fsBtn");
const adOverlay = document.getElementById("adOverlay");

/* ===============================
   BOTÃO JOGAR (DISPARA INTERSTITIAL)
================================ */
playBtn.addEventListener("click", () => {
  playBtn.style.display = "none";
  gameBox.style.display = "block";

  if (!sessionStorage.getItem(adKey)) {
    sessionStorage.setItem(adKey, "1");

    /* Overlay ativo por 1 clique */
    adOverlay.style.display = "block";

    setTimeout(() => {
      adOverlay.style.display = "none";
    }, 1200);
  } else {
    adOverlay.style.display = "none";
  }
}, { once:true });

/* ===============================
   FULLSCREEN REAL
================================ */
fsBtn.addEventListener("click", () => {
  gameBox.classList.add("fullscreen");

  if (gameBox.requestFullscreen) gameBox.requestFullscreen();
  else if (gameBox.webkitRequestFullscreen) gameBox.webkitRequestFullscreen();
});

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    gameBox.classList.remove("fullscreen");
  }
});

/* ===============================
   PUSH MONETAG
   (ativa apenas 1x por sessão)
================================ */
if (!sessionStorage.getItem("monetag_push")) {
  sessionStorage.setItem("monetag_push", "1");

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/monetag-sw.js").catch(()=>{});
  }

  const s = document.createElement("script");
  s.src = "https://monetag.com/push.js";
  s.async = true;
  document.body.appendChild(s);
}
</script>

</body>
</html>
